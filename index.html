<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>美少女游戏数据终端</title>
  </head>
  <body>
    <p id="release-status" role="status">正在载入最新版本…</p>
    <script>
      (() => {
        const status = document.getElementById('release-status');
        const fail = () => { status.textContent = '版本入口载入失败，请刷新重试。'; };
        const nonce = globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random()}`;
        const headUrl = new URL('./release-head.json', document.baseURI);
        headUrl.searchParams.set('_', nonce);
        fetch(headUrl, {
          cache: 'no-store',
          credentials: 'same-origin',
          redirect: 'error'
        }).then(response => {
          if (!response.ok) throw new Error('release head unavailable');
          return response.json();
        }).then(head => {
          const keys = Object.keys(head).sort().join(',');
          const safeId = typeof head.releaseId === 'string'
            && /^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/.test(head.releaseId);
          const expectedEntry = safeId ? `releases/${head.releaseId}/index.html` : '';
          if (keys !== 'closureSha256,entry,releaseId,schemaVersion'
              || head.schemaVersion !== 'egs-tier-release-head-v1'
              || head.entry !== expectedEntry
              || !/^[a-f0-9]{64}$/.test(head.closureSha256)) {
            throw new Error('invalid release head');
          }
          const target = new URL(`./${expectedEntry}`, document.baseURI);
          if (target.origin !== location.origin) throw new Error('cross-origin release entry');
          target.search = location.search;
          target.hash = location.hash;
          location.replace(target.href);
        }).catch(fail);
      })();
    </script>
  </body>
</html>
